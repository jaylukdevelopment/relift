name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
          # Oldest supported interpreter. Kept on 22.04 because setup-python has
          # no prebuilt 3.9 for the newer Ubuntu images and the action fails
          # before any project step runs.
          - os: ubuntu-22.04
            python: "3.9"
          - os: windows-latest
            python: "3.9"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install package and test runner
        shell: bash
        run: python -m pip install -e ".[dev]"

      - name: Byte-compile every module
        shell: bash
        run: python -m compileall -q src/relift tests

      - name: Lint
        shell: bash
        run: ruff check src tests packaging

      - name: Test suite
        shell: bash
        run: python -m pytest -q

      - name: Catalogue renders and stays internally consistent
        shell: bash
        run: |
          set -euo pipefail
          relift list
          relift list --json | python -c "
          import json, sys
          from relift import catalog
          from relift.modules import MODULES
          rows = json.load(sys.stdin)
          assert len(rows) == catalog.counts()['total'], 'list --json disagrees with the catalogue'
          ids = {r['id'] for r in rows}
          implemented = {r['id'] for r in rows if r['implemented']}
          runnable = implemented - {'report.narrative', 'analysis.attack_chains'}
          missing = runnable - set(MODULES)
          assert not missing, f'implemented without a module: {sorted(missing)}'
          stray = set(MODULES) - ids
          assert not stray, f'modules outside the catalogue: {sorted(stray)}'
          print('catalogue ok:', len(rows), 'techniques,', len(MODULES), 'modules')
          "

      - name: Provider matrix renders offline
        shell: bash
        env:
          RELIFT_AI_PROVIDER: offline
        run: relift providers

      - name: Desktop API starts, serves the UI and refuses without a token
        shell: bash
        env:
          # A runner image must not send a loopback request through a proxy.
          no_proxy: 127.0.0.1,localhost
        run: |
          set -euo pipefail
          python -c "
          import json, re, threading, urllib.error, urllib.request
          from relift.api import build_server
          server, token = build_server(0)
          thread = threading.Thread(target=server.serve_forever, daemon=True)
          thread.start()
          host, port = server.server_address
          base = f'http://{host}:{port}'
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
          html = opener.open(base + '/', timeout=10).read().decode()
          assert 'RELIFT_BOOT' in html, 'UI was served without the bootstrap token'
          request = urllib.request.Request(base + '/api/meta')
          try:
              opener.open(request, timeout=10)
          except urllib.error.HTTPError as exc:
              assert exc.code == 401, exc.code
          else:
              raise SystemExit('API answered without a token')
          request.add_header('X-Relift-Token', token)
          meta = json.loads(opener.open(request, timeout=10).read())
          assert meta['counts']['total'] > 0
          server.shutdown()
          print('desktop api ok:', meta['version'])
          "

      - name: Scope gate refuses an out-of-scope target
        shell: bash
        run: |
          set -euo pipefail
          relift init-scope --engagement ci --host 127.0.0.1 --out "$RUNNER_TEMP/scope.json"
          set +e
          relift scan --target https://example.com --scope "$RUNNER_TEMP/scope.json" --no-ai
          code=$?
          set -e
          echo "exit code was $code"
          test "$code" -eq 2

      - name: Dry run sends nothing and needs --execute
        shell: bash
        run: |
          set -euo pipefail
          relift init-scope --engagement ci --host 127.0.0.1 --out "$RUNNER_TEMP/dry.json"
          relift scan --target http://127.0.0.1:9 --scope "$RUNNER_TEMP/dry.json" --no-ai | tee "$RUNNER_TEMP/plan.txt"
          grep -q "dry run" "$RUNNER_TEMP/plan.txt"

      - name: Database target plans the database techniques
        shell: bash
        run: |
          set -euo pipefail
          relift init-scope --engagement ci-db --host 127.0.0.1 --out "$RUNNER_TEMP/db.json"
          relift plan --target postgres://127.0.0.1:5432/app --scope "$RUNNER_TEMP/db.json" --no-ai \
            | tee "$RUNNER_TEMP/dbplan.txt"
          grep -q "db.fingerprint" "$RUNNER_TEMP/dbplan.txt"
          grep -q "db.security_config" "$RUNNER_TEMP/dbplan.txt"
          ! grep -q "web.headers" "$RUNNER_TEMP/dbplan.txt"
