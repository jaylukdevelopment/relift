name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  dist:
    name: sdist + wheel + zipapp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade build
          python -m build

      - name: Build portable zipapp
        shell: bash
        run: |
          set -euo pipefail
          python -m zipapp src -m "relift.cli:entry" -o dist/relift.pyz -p "/usr/bin/env python3"
          ls -lh dist

      - name: Verify the wheel installs and runs
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/verify"
          "$RUNNER_TEMP/verify/bin/python" -m pip install --quiet dist/*.whl
          "$RUNNER_TEMP/verify/bin/relift" list --json | python -c "
          import json, sys
          print('wheel ok:', len(json.load(sys.stdin)), 'techniques')
          "

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  binary:
    name: binary (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: relift-linux-x64
          - os: windows-latest
            asset: relift-windows-x64.exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        shell: bash
        run: python -m pip install --upgrade pyinstaller

      - name: Build single-file executable
        shell: bash
        run: |
          set -euo pipefail
          python -m PyInstaller --onefile --clean --noconfirm \
            --name relift --paths src --distpath dist packaging/entrypoint.py

      - name: Rename, smoke-test and checksum
        shell: bash
        run: |
          set -euo pipefail
          if [ "${RUNNER_OS}" = "Windows" ]; then
            mv dist/relift.exe "dist/${{ matrix.asset }}"
          else
            mv dist/relift "dist/${{ matrix.asset }}"
          fi
          "dist/${{ matrix.asset }}" list | head -4
          "dist/${{ matrix.asset }}" list --json > /dev/null
          "dist/${{ matrix.asset }}" --help > /dev/null
          sha256sum "dist/${{ matrix.asset }}" > "dist/${{ matrix.asset }}.sha256"
          cat "dist/${{ matrix.asset }}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256

  publish:
    name: publish release
    needs: [dist, binary]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List release assets
        shell: bash
        run: find artifacts -type f | sort

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          fail_on_unmatched_files: true
          generate_release_notes: true
