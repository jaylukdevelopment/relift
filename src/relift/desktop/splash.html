<!DOCTYPE html>
<!--
  Relift desktop — startup splash.

  Loaded from disk into a frameless window before the API exists, so this file
  must never reference the network: no CDN, no webfont, no image. Everything is
  inline and finishes in under two seconds.

  The startup states are the real ones: bind the loopback, load the gate, start
  the engine, open the console. The bar fills once; nothing sweeps, pulses or
  glows.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="dark">
  <title>Relift</title>
  <style>
    :root {
      --ground: #000101;
      --border: #17191c;
      --rule: #0f1113;
      --ink: #ecebe7;
      --meta: #8b8780;
      --faint: #757168;
      --serif: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
      --sans: Arial, Helvetica, "Helvetica Neue", sans-serif;
      --mono: "Courier New", Courier, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      display: grid;
      grid-template-rows: 1fr auto;
      padding: 22px 24px 20px;
      background: var(--ground);
      color: var(--ink);
      font: 12px/1.5 var(--sans);
      border: 1px solid var(--border);
      overflow: hidden;
      user-select: none;
      cursor: default;
      -webkit-font-smoothing: antialiased;
    }

    .top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }
    .name {
      font-family: var(--serif);
      font-size: 24px;
      line-height: 1;
      letter-spacing: -0.01em;
      opacity: 0;
      transform: translateY(5px);
      animation: settle 520ms cubic-bezier(.22, .61, .36, 1) 80ms forwards;
    }
    .what {
      margin-top: 9px;
      font-size: 11.5px;
      color: var(--meta);
      opacity: 0;
      animation: fade 420ms ease 240ms forwards;
    }
    .version {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--faint);
      opacity: 0;
      animation: fade 420ms ease 320ms forwards;
    }

    .foot { display: grid; gap: 10px; }
    .track {
      height: 1px;
      background: var(--rule);
      overflow: hidden;
    }
    .track span {
      display: block;
      height: 100%;
      width: 0;
      background: var(--ink);
      animation: fill 1180ms cubic-bezier(.3, .7, .3, 1) 120ms forwards;
    }
    .status {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      font-size: 11.5px;
      color: var(--faint);
    }
    .status #line { color: var(--meta); }

    @keyframes settle { to { opacity: 1; transform: none; } }
    @keyframes fade { to { opacity: 1; } }
    @keyframes fill { to { width: 100%; } }

    @media (prefers-reduced-motion: reduce) {
      .name, .what, .version { opacity: 1; transform: none; animation: none; }
      .track span { animation: none; width: 100%; }
    }
  </style>
</head>
<body>
  <div class="top">
    <div>
      <div class="name">Relift</div>
      <div class="what">Authorised assessment console</div>
    </div>
    <div class="version">v{{version}}</div>
  </div>

  <div class="foot">
    <div class="track" role="progressbar" aria-label="Starting"><span></span></div>
    <div class="status">
      <span id="line">Binding loopback</span>
      <span>Scope gate on</span>
    </div>
  </div>

  <script>
    (function () {
      var lines = [
        "Binding loopback",
        "Loading the scope gate",
        "Starting the engine",
        "Opening the console"
      ];
      var node = document.getElementById("line");
      var step = 0;
      var timer = setInterval(function () {
        step += 1;
        if (step >= lines.length) {
          clearInterval(timer);
          return;
        }
        node.textContent = lines[step];
      }, 320);
    })();
  </script>
</body>
</html>
